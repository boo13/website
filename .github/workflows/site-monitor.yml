name: Weekly Site Monitoring

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      LIGHTHOUSE_FAILURE_THRESHOLD: ${{ vars.LIGHTHOUSE_FAILURE_THRESHOLD || 2 }}
    steps:
      - uses: actions/checkout@v3
      - name: Run Lighthouse
        id: lighthouse
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ secrets.SITE_URL }}
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: .github/lighthouserc.json
      - name: Collect Lighthouse summary
        if: always() && steps.lighthouse.outcome != 'skipped'
        id: lighthouse_summary
        run: |
          if [ ! -d ".lighthouseci" ]; then
            echo "No Lighthouse artifacts produced"
            exit 0
          fi

          REPORT_FILE=$(find .lighthouseci -name '*.report.json' | sort | head -n1)
          SUMMARY_FILE=$(find .lighthouseci -name '*.summary.json' | sort | head -n1)

          if [ -z "$REPORT_FILE" ]; then
            echo "No Lighthouse report found"
            exit 0
          fi

          node .github/scripts/build-lighthouse-details.mjs "$REPORT_FILE" "$SUMMARY_FILE"
          {
            echo "details_file=lighthouse-details.md"
            echo "issue_body<<EOF"
            cat lighthouse-details.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Track Lighthouse failure streak
        if: steps.lighthouse.outcome == 'failure'
        id: lighthouse_failure_tracker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: site-monitor.yml
        run: |
          THRESHOLD=${LIGHTHOUSE_FAILURE_THRESHOLD:-2}
          API_URL="https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/runs?status=completed&per_page=10"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL" -o workflow-runs.json

          STREAK=$(python3 .github/scripts/count-lighthouse-failures.py workflow-runs.json)

          TOTAL=$((STREAK + 1))
          echo "count=$TOTAL" >> $GITHUB_OUTPUT
          echo "threshold=$THRESHOLD" >> $GITHUB_OUTPUT
          if [ "$TOTAL" -ge "$THRESHOLD" ]; then
            echo "should_alert=true" >> $GITHUB_OUTPUT
          else
            echo "should_alert=false" >> $GITHUB_OUTPUT
          fi
      - name: Suppress noisy Lighthouse alert
        if: steps.lighthouse.outcome == 'failure' && steps.lighthouse_failure_tracker.outputs.should_alert != 'true'
        run: |
          echo "Lighthouse failed but streak (${{ steps.lighthouse_failure_tracker.outputs.count }}) is below threshold (${{ steps.lighthouse_failure_tracker.outputs.threshold }}). Alerts suppressed."
      - name: Create Lighthouse failure issue with audit detail
        if: steps.lighthouse.outcome == 'failure' && steps.lighthouse_failure_tracker.outputs.should_alert == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          STREAK: ${{ steps.lighthouse_failure_tracker.outputs.count }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DETAILS_FILE=${{ steps.lighthouse_summary.outputs.details_file || 'lighthouse-details.md' }}
          if [ -z "$DETAILS_FILE" ] || [ ! -f "$DETAILS_FILE" ]; then
            DETAILS_FILE=lighthouse-details.md
            echo "Lighthouse artifacts missing." > "$DETAILS_FILE"
          fi

          MESSAGE_FILE=lighthouse-issue.md
          {
            echo "Lighthouse has failed $STREAK consecutive time(s) for $SITE_URL."
            echo
            echo "Workflow run: $RUN_URL"
            echo
            cat "$DETAILS_FILE"
          } > "$MESSAGE_FILE"

          ISSUE_NUMBER=$(gh issue list --label lighthouse --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ "$ISSUE_NUMBER" = "null" ]; then
            ISSUE_NUMBER=""
          fi
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file "$MESSAGE_FILE"
          else
            gh issue create \
              --title "🚨 Lighthouse regression detected" \
              --body-file "$MESSAGE_FILE" \
              --label incident \
              --label lighthouse
          fi
      - name: Send Slack alert on Lighthouse failure
        if: steps.lighthouse.outcome == 'failure' && steps.lighthouse_failure_tracker.outputs.should_alert == 'true'
        run: |
          SUMMARY=$(printf '%s\n\n%s\n\nURL: %s\nConsecutive failures: %s (threshold %s)\n\n%s\n%s\n' \
            '🚨 Lighthouse alert' \
            'Lighthouse check failed for your site.' \
            '${{ secrets.SITE_URL }}' \
            '${{ steps.lighthouse_failure_tracker.outputs.count }}' \
            '${{ steps.lighthouse_failure_tracker.outputs.threshold }}' \
            'Check the GitHub Actions logs for details:' \
            'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}')

          PAYLOAD=$(jq -n --arg text "$SUMMARY" '{text:$text}')
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Fail workflow on sustained Lighthouse regressions
        if: steps.lighthouse.outcome == 'failure' && steps.lighthouse_failure_tracker.outputs.should_alert == 'true'
        run: |
          echo "Lighthouse has failed ${{ steps.lighthouse_failure_tracker.outputs.count }} consecutive time(s), exceeding the threshold ${{ steps.lighthouse_failure_tracker.outputs.threshold }}."
          exit 1

  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check website availability and timing
        id: site_check
        run: |
          URL="${{ secrets.SITE_URL }}"

          echo "Checking $URL"

          START=$(date +%s%3N)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 "$URL")
          END=$(date +%s%3N)
          DURATION=$((END - START))

          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

          if [ "$STATUS" -ge 400 ]; then
            echo "Site returned error status $STATUS"
            exit 1
          fi

          if [ "$DURATION" -gt 3000 ]; then
            echo "Site is slow: ${DURATION}ms"
            exit 1
          fi

      - name: Check SSL certificate expiration
        id: ssl_check
        run: |
          DOMAIN=$(echo "${{ secrets.SITE_URL }}" | sed -e 's|https://||' -e 's|/.*||')

          EXPIRY_DATE=$(echo | \
            openssl s_client -servername "$DOMAIN" -connect "$DOMAIN:443" 2>/dev/null | \
            openssl x509 -noout -enddate | cut -d= -f2)

          EXPIRY_TS=$(date -d "$EXPIRY_DATE" +%s)
          NOW_TS=$(date +%s)
          DAYS_LEFT=$(( (EXPIRY_TS - NOW_TS) / 86400 ))

          echo "days_left=$DAYS_LEFT" >> $GITHUB_OUTPUT

          if [ "$DAYS_LEFT" -lt 14 ]; then
            echo "SSL certificate expires in $DAYS_LEFT days"
            exit 1
          fi

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '🚨 Site monitoring alert'
          body: |
            There is a problem with your site.

            URL: ${{ secrets.SITE_URL }}

            Check the GitHub Actions logs for details:
            https://github.com/${{ github.repository }}/actions
          to: ${{ secrets.EMAIL_TO }}
          from: 'Site Monitor'

      - name: Create failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🚨 Site Monitoring Alert: ${{ secrets.SITE_URL }}" \
            --body "The site monitoring workflow failed. Check the logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "incident"

      - name: Send Slack alert
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"🚨 Site monitoring alert\n\nThere is a problem with your site.\n\nURL: ${{ secrets.SITE_URL }}\n\nCheck the GitHub Actions logs for details:\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}

  regional_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        region:
          - name: us-east-1
            country: US
            city: Ashburn
          - name: eu-west-1
            country: IE
            city: Dublin

    steps:
      - uses: actions/checkout@v3
      - name: Check site via Globalping (${{ matrix.region.name }})
        id: globalping_check
        env:
          TARGET_URL: ${{ secrets.SITE_URL }}
          COUNTRY: ${{ matrix.region.country }}
          CITY: ${{ matrix.region.city }}
          REGION_NAME: ${{ matrix.region.name }}
        run: |
          TARGET_HOST=$(echo "$TARGET_URL" | sed -e 's|https\?://||' -e 's|/.*||')
          REQUEST_BODY=$(jq -n --arg target "$TARGET_HOST" --arg country "$COUNTRY" --arg city "$CITY" '
            {
              type: "http",
              target: $target,
              limit: 1,
              locations: [
                ({ country: $country } + (if ($city | length) > 0 then {city: $city} else {} end))
              ]
            }
          ')

          CREATE_RESPONSE=$(curl -sS -H 'Content-Type: application/json' -d "$REQUEST_BODY" https://api.globalping.io/v1/measurements)
          MEASUREMENT_ID=$(echo "$CREATE_RESPONSE" | jq -r '.id // .measurementId // empty')
          if [ -z "$MEASUREMENT_ID" ]; then
            echo "Failed to start Globalping measurement for $REGION_NAME: $CREATE_RESPONSE"
            exit 1
          fi

          ATTEMPTS=0
          while [ $ATTEMPTS -lt 12 ]; do
            RESULT=$(curl -sS "https://api.globalping.io/v1/measurements/$MEASUREMENT_ID")
            STATUS=$(echo "$RESULT" | jq -r '.status')
            if [ "$STATUS" = "finished" ]; then
              echo "$RESULT" > globalping-result.json
              break
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "Globalping measurement failed: $RESULT"
              exit 1
            fi
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ $ATTEMPTS -lt 12 ]; then
              sleep 5
            fi
          done

          if [ ! -f globalping-result.json ]; then
            echo "Globalping measurement did not complete in time for $REGION_NAME"
            exit 1
          fi

          STATUS_CODE=$(jq -r '.results[0].result.statusCode // .results[0].result.response.statusCode // empty' globalping-result.json)
          if [ -z "$STATUS_CODE" ] || [ "$STATUS_CODE" = "null" ]; then
            echo "Unable to read HTTP status code for $REGION_NAME"
            cat globalping-result.json
            exit 1
          fi

          echo "Remote probe returned HTTP $STATUS_CODE from $REGION_NAME"

          if [ "$STATUS_CODE" -ge 400 ]; then
            echo "Regional probe saw failing status code $STATUS_CODE"
            exit 1
          fi

          DURATION=$(jq -r '.results[0].result.timings.total // .results[0].result.timings.duration // .results[0].result.averageResponseTime // empty' globalping-result.json)
          if [ -n "$DURATION" ] && [ "$DURATION" != "null" ]; then
            python3 .github/scripts/check-regional-latency.py "$DURATION"
          fi

      - name: Send Slack alert for regional outage
        if: failure()
        env:
          REGION_NAME: ${{ matrix.region.name }}
        run: |
          SUMMARY=$(printf '%s\n\nThe %s Globalping probe reported a problem for %s.\n\n%s\n%s\n' \
            '🚨 Regional uptime alert' \
            "$REGION_NAME" \
            '${{ secrets.SITE_URL }}' \
            'Check the GitHub Actions logs for details:' \
            'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}')

          PAYLOAD=$(jq -n --arg text "$SUMMARY" '{text:$text}')
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" ${{ secrets.SLACK_WEBHOOK_URL }}
