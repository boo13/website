<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Styles injected by Vite from src/main-contact.js -->
  </head>
  <body>
    <form
      id="fs-frm"
      name="simple-contact-form"
      accept-charset="utf-8"
      action="https://formspree.io/f/xyzyzvyn"
      method="post"
    >
      <fieldset id="fs-frm-inputs">
        <input
          type="text"
          name="name"
          id="full-name"
          placeholder="Your Name"
          required=""
        />
        <!-- <label for="email-address">Email Address</label> -->
        <input
          type="email"
          name="_replyto"
          id="email-address"
          placeholder="Your Email"
          required=""
        />
        <!-- <label for="message">Message</label> -->
        <textarea
          rows="5"
          name="message"
          id="message"
          placeholder="Anything you want to say..."
          required=""
        ></textarea>
        <input
          type="hidden"
          name="_subject"
          id="email-subject"
          value="Contact Form Submission"
        />
      </fieldset>
      <input id="fs-frm-submit" type="submit" value="Submit" />
      <p id="fs-frm-status"></p>
    </form>
    <script type="module" src="/src/main-contact.js"></script>
  </body>
</html>
