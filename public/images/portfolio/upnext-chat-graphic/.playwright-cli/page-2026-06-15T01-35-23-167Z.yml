          - paragraph [ref=e101]: Produced as part of the "History Honors 250" initiative, this two-part, four-hour documentary event chronicles the life of Hunkpapa Lakota leader Sitting Bull. Featuring Michael Spears as Sitting Bull and narrated by Mo Brings Plenty, the production emphasizes authentic Native perspectives through high-end scripted sequences and expert commentary. It covers pivotal historical milestones including the Battle of the Little Bighorn, his time in Buffalo Bill's Wild West show, and the tragic events surrounding the Ghost Dance movement. The docuseries premiered on The History Channel in May 2025 as a centerpiece of the network's national anniversary programming.
