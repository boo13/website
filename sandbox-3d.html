<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Portrait Sandbox</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08090c;
      --ink: #e8ecf4;
      --accent: #f06b4a;
      --accent-2: #9aa7ff;
      --panel: rgba(15, 18, 26, 0.85);
      --border: rgba(244, 246, 251, 0.1);
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      overflow-x: hidden;
    }

    /* Three.js canvas — fixed behind everything */
    #canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
    }

    /* Scroll proxy — invisible, just provides scroll distance */
    #scroll-proxy {
      position: relative;
      z-index: 1;
      height: 500vh;
      pointer-events: none;
    }
    .scroll-label {
      position: absolute;
      left: 32px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(244, 246, 251, 0.25);
      pointer-events: none;
      transform: translateY(-50%);
    }
    .scroll-label::before {
      content: "";
      display: inline-block;
      width: 20px;
      height: 1px;
      background: rgba(244, 246, 251, 0.2);
      vertical-align: middle;
      margin-right: 8px;
    }

    /* Loading overlay */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .loader-inner {
      text-align: center;
      width: min(320px, 80vw);
    }
    .loader-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(244, 246, 251, 0.5);
      margin-bottom: 20px;
    }
    .progress-track {
      height: 2px;
      background: rgba(244, 246, 251, 0.1);
      border-radius: 1px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 1px;
      transition: width 0.15s ease;
    }
    .progress-pct {
      font-size: 0.75rem;
      color: rgba(244, 246, 251, 0.4);
      margin-top: 10px;
    }

    /* Controls panel — fixed top-right */
    #controls {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      width: 260px;
      background: var(--panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      font-size: 0.75rem;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #controls.visible { opacity: 1; }
    .ctrl-section {
      margin-bottom: 14px;
    }
    .ctrl-section:last-child { margin-bottom: 0; }
    .ctrl-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(244, 246, 251, 0.55);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.65rem;
      margin-bottom: 6px;
    }
    .ctrl-label .val {
      color: var(--ink);
      font-weight: 500;
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 3px;
      border-radius: 2px;
      background: rgba(244, 246, 251, 0.12);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    .ctrl-toggle {
      display: flex;
      gap: 6px;
    }
    .ctrl-toggle button {
      flex: 1;
      padding: 7px 8px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: rgba(244, 246, 251, 0.5);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .ctrl-toggle button.active {
      background: rgba(240, 107, 74, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }
    .ctrl-toggle button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Stats overlay — fixed bottom-left */
    #stats {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      font-size: 0.65rem;
      color: rgba(244, 246, 251, 0.3);
      line-height: 1.6;
    }

    /* Scroll hint */
    #scroll-hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(244, 246, 251, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    #scroll-hint.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Loading overlay -->
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-title">Loading Point Cloud</div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-pct" id="progress-pct">0%</div>
    </div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <div class="ctrl-section">
      <div class="ctrl-label">Mode</div>
      <div class="ctrl-toggle" id="mode-tabs">
        <button class="active" data-mode="particles">Particles</button>
        <button data-mode="splat" disabled title="Coming soon">Splat</button>
        <button data-mode="depth" disabled title="Coming soon">Depth</button>
      </div>
    </div>
    <div class="ctrl-section">
      <div class="ctrl-label">Point Size <span class="val" id="size-val">2.0</span></div>
      <input type="range" id="point-size" min="0.5" max="12" step="0.1" value="2.0">
    </div>
    <div class="ctrl-section">
      <div class="ctrl-label">Point Count <span class="val" id="count-val">600K</span></div>
      <input type="range" id="point-count" min="50000" max="1000000" step="50000" value="600000">
    </div>
    <div class="ctrl-section">
      <div class="ctrl-label">Opacity Filter <span class="val" id="opacity-val">0.5</span></div>
      <input type="range" id="opacity-thresh" min="0" max="0.99" step="0.01" value="0.5">
    </div>
    <div class="ctrl-section">
      <div class="ctrl-label" style="font-size: 0.55rem; color: rgba(244,246,251,0.35); line-height: 1.5;">
        Scroll down to trigger photo → particle transition.
        Adjust sliders then reload to re-parse PLY.
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div id="stats"></div>

  <!-- Scroll hint -->
  <div id="scroll-hint">Scroll to explore</div>

  <!-- Scroll proxy for ScrollTrigger -->
  <div id="scroll-proxy">
    <div class="scroll-label" style="top: 5%;">Flat Image</div>
    <div class="scroll-label" style="top: 20%;">Depth Reveal</div>
    <div class="scroll-label" style="top: 45%;">Orbit</div>
    <div class="scroll-label" style="top: 65%;">Scatter</div>
    <div class="scroll-label" style="top: 85%;">Dissolve</div>
  </div>

  <script type="module" src="/src/main-sandbox-3d.js"></script>
</body>
</html>
