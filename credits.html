<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Credits - Randy Counsman</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <link rel="stylesheet" href="https://use.typekit.net/gya6int.css" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="favicon/site.webmanifest" />
    <style>
      body {
        background-color: var(--clr-nearblack);
        color: var(--clr-offwhite);
        font-family: 'Lato', sans-serif;
        padding: 2rem;
        margin: 0;
        min-height: 100vh;
      }

      .table-wrapper {
        max-width: 1200px;
        margin: 0 auto;
        overflow-x: auto;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
      }

      thead {
        background: rgba(255, 255, 255, 0.05);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      th {
        padding: 1.25rem 1.5rem;
        text-align: left;
        font-weight: 400;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: rgba(247, 248, 244, 0.8);
        cursor: pointer;
        user-select: none;
        transition: all 0.2s ease;
        position: relative;
        white-space: nowrap;
      }

      th:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--clr-offwhite);
      }

      th.sortable::after {
        content: '⇅';
        margin-left: 0.5rem;
        opacity: 0.3;
        font-size: 0.9rem;
      }

      th.sort-asc::after {
        content: '↑';
        opacity: 1;
      }

      th.sort-desc::after {
        content: '↓';
        opacity: 1;
      }

      tbody tr {
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        transition: all 0.2s ease;
      }

      tbody tr:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      tbody tr:last-child {
        border-bottom: none;
      }

      td {
        padding: 1.25rem 1.5rem;
        color: rgba(247, 248, 244, 0.9);
      }

      td.title {
        font-weight: 400;
        color: var(--clr-offwhite);
        font-size: 1rem;
      }

      td.year {
        font-family: 'Poppins', sans-serif;
        font-weight: 300;
        opacity: 0.7;
      }

      td.platform {
        opacity: 0.8;
      }

      td.role {
        opacity: 0.7;
        font-size: 0.9rem;
      }

      .no-results {
        text-align: center;
        padding: 3rem;
        opacity: 0.5;
        font-style: italic;
      }

      .image-popup {
        position: fixed;
        pointer-events: none;
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .image-popup.visible {
        opacity: 1;
      }

      .image-popup img {
        width: 200px;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        border: 2px solid rgba(255, 255, 255, 0.1);
        display: block;
      }

      tbody tr {
        cursor: pointer;
      }

      @media (max-width: 768px) {
        th, td {
          padding: 1rem;
          font-size: 0.85rem;
        }

        .image-popup img {
          width: 150px;
        }
      }
    </style>
  </head>
  <body>
    <div class="table-wrapper">
      <table id="creditsTable">
        <thead>
          <tr>
            <th class="sortable" data-column="title">Title</th>
            <th class="sortable" data-column="platform">Platform</th>
            <th class="sortable" data-column="year">Year</th>
            <th class="sortable" data-column="role">Role</th>
          </tr>
        </thead>
        <tbody id="creditsBody">
          <tr>
            <td colspan="4" class="no-results">Loading projects...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div id="imagePopup" class="image-popup">
      <img src="" alt="" />
    </div>

    <script>
      class CreditsTable {
        constructor() {
          this.projects = [];
          this.sortColumn = 'year';
          this.sortDirection = 'desc';

          this.tbody = document.getElementById('creditsBody');
          this.imagePopup = document.getElementById('imagePopup');
          this.popupImg = this.imagePopup.querySelector('img');

          this.init();
        }

        async init() {
          await this.loadProjects();
          this.initEventListeners();
          this.initImagePopup();
          this.render();
        }

        async loadProjects() {
          try {
            const response = await fetch('./data/projects.json');
            const data = await response.json();
            this.projects = data.projects;
          } catch (error) {
            console.error('Error loading projects:', error);
            this.tbody.innerHTML = `
              <tr>
                <td colspan="4" class="no-results">
                  Error loading projects. Please check that data/projects.json exists.
                </td>
              </tr>
            `;
          }
        }

        initEventListeners() {
          // Column header sorting
          document.querySelectorAll('th.sortable').forEach(th => {
            th.addEventListener('click', () => {
              const column = th.dataset.column;
              this.handleSort(column);
            });
          });
        }

        initImagePopup() {
          // Mouse move to follow cursor with offset
          document.addEventListener('mousemove', (e) => {
            if (this.imagePopup.classList.contains('visible')) {
              // Offset to the right and down from cursor
              this.imagePopup.style.left = (e.clientX + 20) + 'px';
              this.imagePopup.style.top = (e.clientY + 20) + 'px';
            }
          });

          // Delegate event listeners to tbody for row hover
          this.tbody.addEventListener('mouseenter', (e) => {
            const row = e.target.closest('tr');
            if (row && row.dataset.poster) {
              this.showPopup(row.dataset.poster);
            }
          }, true);

          this.tbody.addEventListener('mouseleave', (e) => {
            const row = e.target.closest('tr');
            if (row && row.dataset.poster) {
              this.hidePopup();
            }
          }, true);
        }

        showPopup(posterUrl) {
          this.popupImg.src = posterUrl;
          this.imagePopup.classList.add('visible');
        }

        hidePopup() {
          this.imagePopup.classList.remove('visible');
        }

        handleSort(column) {
          if (this.sortColumn === column) {
            this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
          } else {
            this.sortColumn = column;
            this.sortDirection = column === 'year' ? 'desc' : 'asc';
          }

          this.updateSortIndicators();
          this.sortProjects();
          this.render();
        }

        updateSortIndicators() {
          document.querySelectorAll('th.sortable').forEach(th => {
            th.classList.remove('sort-asc', 'sort-desc');
            if (th.dataset.column === this.sortColumn) {
              th.classList.add(`sort-${this.sortDirection}`);
            }
          });
        }

        sortProjects() {
          this.projects.sort((a, b) => {
            let valA = a[this.sortColumn];
            let valB = b[this.sortColumn];

            // Handle null/undefined values
            if (valA === null || valA === undefined) return 1;
            if (valB === null || valB === undefined) return -1;

            // String comparison (case-insensitive)
            if (typeof valA === 'string') {
              valA = valA.toLowerCase();
              valB = valB.toLowerCase();
            }

            let comparison = 0;
            if (valA > valB) comparison = 1;
            if (valA < valB) comparison = -1;

            return this.sortDirection === 'asc' ? comparison : -comparison;
          });
        }

        render() {
          if (this.projects.length === 0) {
            this.tbody.innerHTML = `
              <tr>
                <td colspan="4" class="no-results">No projects available.</td>
              </tr>
            `;
            return;
          }

          this.tbody.innerHTML = this.projects.map(project => `
            <tr data-poster="${project.poster || ''}">
              <td class="title">${this.escapeHtml(project.title)}</td>
              <td class="platform">${this.escapeHtml(project.platform)}</td>
              <td class="year">${project.year}</td>
              <td class="role">${this.escapeHtml(project.role)}</td>
            </tr>
          `).join('');
        }

        escapeHtml(text) {
          const div = document.createElement('div');
          div.textContent = text;
          return div.innerHTML;
        }
      }

      // Initialize table when DOM is ready
      document.addEventListener('DOMContentLoaded', () => {
        new CreditsTable();
      });
    </script>
  </body>
</html>
