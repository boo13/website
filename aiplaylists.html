<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Playlists | Randy Counsman</title>
    <meta
      name="description"
      content="A public archive of AI-generated playlists created through AIHome and published to YouTube Music."
    />
    <link rel="stylesheet" href="https://use.typekit.net/bnp0hyp.css" />
    <link rel="stylesheet" href="https://use.typekit.net/gya6int.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="feed-shell">
      <div class="feed-glow feed-glow--top" aria-hidden="true"></div>
      <div class="feed-glow feed-glow--bottom" aria-hidden="true"></div>

      <header class="hero">
        <div class="hero__copy">
          <h1>AI playlists<br>made for Randy.</h1>
          <p class="hero__lede">
            Daily experiments, one-off deep dives, and machine-assisted curation from the AIHome
            stack. Every entry links out to YouTube Music.
          </p>
        </div>
        <div class="hero__meta">
          <div class="meta-card">
            <span class="meta-card__label">Feed</span>
            <strong id="feed-count" class="meta-card__value">&hellip;</strong>
            <span class="meta-card__note">playlists</span>
          </div>
          <div class="meta-card">
            <span class="meta-card__label">Status</span>
            <strong id="feed-status" class="meta-card__value">Loading</strong>
            <span id="feed-updated" class="meta-card__note"></span>
          </div>
        </div>
      </header>

      <hr class="hero__divider" aria-hidden="true" />

      <main class="playlist-feed">
        <section id="feed-state" class="feed-state" aria-live="polite">
          <div class="feed-state__card">
            <p class="feed-state__eyebrow">Loading</p>
            <h2>Pulling the latest public feed.</h2>
            <p>Reading <code>/data/ai-playlists.json</code> and assembling the archive.</p>
          </div>
        </section>

        <section id="playlist-list" class="playlist-list" hidden></section>
      </main>
    </div>

    <script type="module" src="/src/main-aiplaylists.js"></script>
  </body>
</html>
